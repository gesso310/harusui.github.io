<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>harusui</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #ffffff;
    }

    header {
      padding: 20px;
    }

    header img {
      width: 120px;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0;
    }

    .menu {
      margin: 30px 0;
    }

    .menu a {
      display: inline-block;
      margin: 10px;
      padding: 15px 25px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: 0.3s;
    }

    .menu a:hover {
      background: #444;
    }

    /* YouTube */
    .youtube {
      padding: 40px 20px;
    }

    .youtube h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .youtube p {
      color: #666;
      margin-bottom: 20px;
    }

    .youtube-box {
      max-width: 600px;
      margin: 0 auto 20px;
    }

    .youtube-box iframe {
      width: 100%;
      height: 315px;
      border-radius: 10px;
    }

    .youtube-btn {
      display: inline-block;
      padding: 12px 20px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 25px;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <!-- ロゴ -->
  <header>
    <img src="logo.png" alt="harusui logo">
    <h1>harusui</h1>
  </header>

  <!-- メニュー -->
  <div class="menu">
    <a href="games.html">🎮 Games</a>
    <a href="shop.html">🛒 Shop</a>
  </div>

  <!-- YouTube -->
  <section class="youtube">
    <h2>🎬 YouTube</h2>
    <p>harusuiの世界を動画で楽しもう</p>

    <div class="youtube-box">
      <iframe 
        src="https://www.youtube.com/embed/MF7HWlyJxA8?
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>

    <a href="https://www.youtube.com/@harusui? si=tdXrmw２CHFCjc4w2 target="_blank" class="youtube-btn">
      ▶ チャンネルを見る
    </a>
  </section>

  <!-- フッター -->
  <footer>
    © harusui
  </footer>

</body>
</html>
